// ARXOS Firefox hardening (autoconfig) — aggressive, workstation-usable.
// Applied globally via /usr/lib/firefox/defaults/pref/autoconfig.js -> this file.
// lockPref = user cannot change; defaultPref = hardened default the user may override.
// Trade-offs noted inline; this is the "super secure" posture the ARXOS default ships.

// ---- telemetry / data collection: OFF and locked ----
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("toolkit.telemetry.archive.enabled", false);
lockPref("toolkit.telemetry.newProfilePing.enabled", false);
lockPref("toolkit.telemetry.shutdownPingSender.enabled", false);
lockPref("toolkit.telemetry.coverage.opt-out", true);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("app.normandy.enabled", false);
lockPref("breakpad.reportURL", "");
lockPref("browser.tabs.crashReporting.sendReport", false);

// ---- anti-fingerprinting (RFP is the strong one; forces light theme + UTC, that is the cost) ----
defaultPref("privacy.resistFingerprinting", true);
defaultPref("privacy.resistFingerprinting.letterboxing", false); // avoid the grey bars
defaultPref("privacy.fingerprintingProtection", true);
defaultPref("webgl.disabled", false); // leave WebGL on (RFP already spoofs it); tools need canvas

// ---- tracking protection: strict ----
defaultPref("browser.contentblocking.category", "strict");
defaultPref("privacy.trackingprotection.enabled", true);
defaultPref("privacy.trackingprotection.socialtracking.enabled", true);
defaultPref("privacy.trackingprotection.cryptomining.enabled", true);
defaultPref("privacy.trackingprotection.fingerprinting.enabled", true);

// ---- cookies: block cross-site trackers + partition the rest (total cookie protection) ----
defaultPref("network.cookie.cookieBehavior", 5);
defaultPref("privacy.partition.serviceWorkers", true);
defaultPref("privacy.partition.network_state.ocsp_cache", true);

// ---- WebRTC: leave on, but never leak the local/private IP ----
defaultPref("media.peerconnection.enabled", true);
defaultPref("media.peerconnection.ice.default_address_only", true);
defaultPref("media.peerconnection.ice.no_host", true);
defaultPref("media.peerconnection.ice.proxy_only_if_behind_proxy", true);

// ---- prefetch / speculative connections: OFF (privacy + no phantom requests) ----
lockPref("network.prefetch-next", false);
lockPref("network.dns.disablePrefetch", true);
lockPref("network.dns.disablePrefetchFromHTTPS", true);
lockPref("network.predictor.enabled", false);
lockPref("network.predictor.enable-prefetch", false);
lockPref("network.http.speculative-parallel-limit", 0);
lockPref("browser.urlbar.speculativeConnect.enabled", false);
lockPref("browser.places.speculativeConnect.enabled", false);

// ---- HTTPS-only + secure transport ----
defaultPref("dom.security.https_only_mode", true);
defaultPref("dom.security.https_only_mode_ever_enabled", true);
defaultPref("security.ssl.require_safe_negotiation", true);
defaultPref("security.tls.enable_0rtt_data", false);
defaultPref("security.OCSP.enabled", 1);

// ---- referer: trim + do not leak across origins ----
defaultPref("network.http.referer.XOriginPolicy", 2);
defaultPref("network.http.referer.XOriginTrimmingPolicy", 2);
defaultPref("network.http.referer.trimmingPolicy", 2);

// ---- disable location, sensors, autofill, password nags (a workstation, not a personal browser) ----
defaultPref("geo.enabled", false);
defaultPref("permissions.default.geo", 2);
defaultPref("device.sensors.enabled", false);
defaultPref("extensions.formautofill.addresses.enabled", false);
defaultPref("extensions.formautofill.creditCards.enabled", false);
defaultPref("signon.rememberSignons", false);
defaultPref("signon.autofillForms", false);

// ---- new tab / home: no sponsored, no snippets, no pocket ----
lockPref("browser.newtabpage.activity-stream.showSponsored", false);
lockPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
lockPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
lockPref("browser.newtabpage.activity-stream.feeds.snippets", false);
lockPref("extensions.pocket.enabled", false);

// ---- DNS-over-HTTPS (Quad9, blocks malware domains) ----
defaultPref("network.trr.mode", 2);
defaultPref("network.trr.uri", "https://dns.quad9.net/dns-query");

// ---- misc hardening ----
defaultPref("browser.safebrowsing.downloads.remote.enabled", false); // no upload of DLs to Google
defaultPref("beacon.enabled", false);
defaultPref("browser.send_pings", false);
defaultPref("dom.battery.enabled", false);
defaultPref("network.IDN_show_punycode", true); // anti-phishing
defaultPref("pdfjs.enableScripting", false);
